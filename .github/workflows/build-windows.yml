name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub website

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Windows
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bloom-Cafe-POS-Windows-Setup
          path: dist/*.exe
          retention-days: 30

      - name: Upload to Release Package folder info
        run: |
          echo "Build complete. Installer is in dist/ folder."
          dir dist/
