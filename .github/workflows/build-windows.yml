name: Build Windows Installer

# - Every push to main, every pull request and manual runs: test, build the
#   installer, and install / update / uninstall it for real on Windows.
# - Pushing a tag like v1.3.0 additionally publishes a GitHub Release with the
#   installer attached (the tag must match "version" in package.json).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # allows manual trigger from GitHub website

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check the tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version - bump the version (and CHANGELOG.md) before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Windows
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Unit + integration tests
        run: npm test

      - name: End-to-end test (real app, human-style clicks)
        run: npm run test:e2e

      - name: Build Windows installer
        run: npm run dist:win

      - name: Checksum the installer
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist -Filter 'Bloom-Cafe-POS-Setup-*.exe')
          if ($exe.Count -ne 1) { throw "Expected exactly one Bloom-Cafe-POS-Setup-*.exe in dist/, found $($exe.Count)" }
          $hash = (Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe[0].Name)" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Write-Host ("{0}  {1:N1} MB  sha256 {2}" -f $exe[0].Name, ($exe[0].Length / 1MB), $hash)

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: Bloom-Cafe-POS-Windows-Setup
          path: |
            dist/Bloom-Cafe-POS-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  client-install:
    # Does what the cafe laptop does: a folder that still has the v1.2.x
    # UPDATE.bat is updated with it, which hands over to the new UPDATE.bat and
    # INSTALL.bat (npm ci, build, backup, silent install). The folder path has a
    # space in it on purpose. Then the installed app is checked, upgraded while
    # running and uninstalled (data must survive).
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Prepare a cafe-laptop folder with the v1.2.x UPDATE.bat
        shell: pwsh
        run: ./build/ci/prepare-legacy-client.ps1 -Source $env:GITHUB_WORKSPACE -Client "$env:RUNNER_TEMP\cafe laptop\POS-BASIC-BILLING"

      - name: Run UPDATE.bat like a double-click
        shell: cmd
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          call UPDATE.bat < NUL
          if errorlevel 1 exit /b 1

      - name: Check install, backup, upgrade while running, uninstall
        shell: pwsh
        run: ./build/ci/check-install.ps1 -Repo $env:CLIENT_DIR

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: client-install-logs
          path: |
            ${{ env.CLIENT_DIR }}/*.log
            ${{ runner.temp }}/ci-logs/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, client-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: Bloom-Cafe-POS-Windows-Setup
          path: dist

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && $0 != "---" { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "See CHANGELOG.md for the full list of changes." > release-notes.md
          fi
          cat >> release-notes.md <<'EOF'

          ### Installing

          - **Laptop set up from git:** double-click `UPDATE.bat` in the POS-BASIC-BILLING folder.
          - **Any other PC:** download `Bloom-Cafe-POS-Setup-<version>.exe` below and double-click it.
            Windows may show "Windows protected your PC" because the installer is not code-signed:
            click **More info**, then **Run anyway**.

          Sales, menu and settings (`%APPDATA%\bloom-cafe-pos`) are kept on update and on uninstall.
          `SHA256SUMS.txt` lets you check the download is complete.
          EOF
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Bloom Cafe POS ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/Bloom-Cafe-POS-Setup-*.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
